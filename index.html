<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>mimo｜わたしの支出ノート</title>
<style>
:root{--bg:#fff8fb;--ink:#58475a;--muted:#9b879c;--pink:#f4c6d9;--pink2:#ffe6ef;--lav:#e5dcfa;--mint:#d9eee6;--cream:#fff0cf;--line:#f0e3eb;--white:#fff;--shadow:0 8px 24px rgba(133,91,122,.08)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#fff3f8 0,#fff9fb 240px,var(--bg) 100%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:auto;padding:18px 16px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}.brand{font-weight:800;font-size:23px;letter-spacing:.03em;color:#a96d8e}.sub{font-size:11px;color:var(--muted);margin-top:2px}.pill{border:0;background:#fff;border-radius:99px;padding:9px 12px;color:#9b6b89;font-size:12px;box-shadow:var(--shadow)}
.card{background:rgba(255,255,255,.92);border:1px solid #f5e8ef;border-radius:22px;padding:17px;margin-bottom:14px;box-shadow:var(--shadow)}
.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}.period{font-size:12px;color:#a8879c;margin-top:5px}.total{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:7px 0 2px;color:#795a77}.total small{font-size:15px;font-weight:600}
.inputrow{display:flex;gap:8px;margin-top:11px}.inputrow input{min-width:0;flex:1;border:1.5px solid #f0dce7;border-radius:14px;padding:15px 13px;font-size:16px;color:var(--ink);outline:none;background:#fffafd}.inputrow input:focus{border-color:#d99dbb;box-shadow:0 0 0 3px #fceaf2}.add{border:0;border-radius:14px;background:#e9c5d8;color:#704d66;font-weight:800;padding:0 17px;font-size:14px}.hint{font-size:11px;color:#ad9baa;margin:8px 2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border-radius:16px;padding:12px;background:#fff7fa}.stat:nth-child(2){background:#f7f3ff}.stat b{display:block;font-size:17px;margin-top:4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead strong{font-size:15px}.smallbtn{border:0;background:#fff0f6;color:#a36d8b;border-radius:99px;padding:7px 10px;font-size:11px}
.cat{display:grid;gap:11px}.catline{display:grid;grid-template-columns:92px 1fr 76px;align-items:center;gap:8px;font-size:12px}.bar{height:9px;border-radius:99px;background:#f5edf2;overflow:hidden}.fill{height:100%;border-radius:99px}.catamount{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f5edf2}.item:last-child{border-bottom:0}.dot{width:11px;height:11px;border-radius:50%;flex:none}.itemmain{min-width:0;flex:1}.itemname{font-size:14px;font-weight:700;overflow-wrap:anywhere}.itemmeta{font-size:11px;color:var(--muted);margin-top:3px}.itemamt{font-size:14px;font-weight:800;white-space:nowrap}.actions{display:flex;gap:5px;margin-left:3px}.actions button{border:0;background:#faf4f8;color:#987d94;border-radius:9px;padding:6px 8px;font-size:11px}
.empty{text-align:center;color:#b19eaf;font-size:12px;padding:18px 0}.foot{text-align:center;font-size:10px;color:#b5a5b4;margin:18px 0 0}
.overlay{position:fixed;inset:0;background:#46364b55;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.overlay.show{display:flex}.sheet{width:min(100%,520px);background:#fffafd;border-radius:24px;padding:19px;max-height:85vh;overflow:auto}.sheet h3{margin:0 0 14px;font-size:17px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid #eadbe6;border-radius:12px;padding:12px;background:white;color:var(--ink);font-size:15px}.btnrow{display:flex;gap:8px;margin-top:16px}.btnrow button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:700;background:#f3d9e6;color:#704d66}.btnrow .secondary{background:#f4eff5;color:#88778a}.btnrow .danger{background:#ffe8e8;color:#a35e67}
.settingsline{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f4eaf0;font-size:13px}.settingsline:last-child{border:0}.settingsline input{width:75px;padding:8px;border:1px solid #eadbe6;border-radius:10px;text-align:center;color:var(--ink)}
@media(min-width:520px){.wrap{padding-top:28px}.overlay{align-items:center}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top"><div><div class="brand">mimo <span style="font-size:15px">♡</span></div><div class="sub">わたしの、ちいさな支出ノート</div></div><button class="pill" id="settingsBtn">⚙ 設定</button></header>
 <section class="card">
  <div class="label">今回のカード利用額</div><div class="total" id="total">¥0</div><div class="period" id="period">集計期間を読み込み中…</div>
  <div class="stats" style="margin-top:15px"><div class="stat"><span class="label">記録した件数</span><b id="count">0件</b></div><div class="stat"><span class="label">1回あたり</span><b id="average">¥0</b></div></div>
 </section>
 <section class="card">
  <div class="label">支出をさくっと記録</div>
  <div class="inputrow"><input id="quickInput" type="text" placeholder="例：スタバ 680 ／ 洋服3980" autocomplete="off"><button class="add" id="addBtn">＋ 追加</button></div>
  <div class="hint">用途と金額を一緒に入力するだけ。分類は自動でおまかせ ♡</div>
 </section>
 <section class="card"><div class="sectionhead"><strong>今月の内訳</strong><span class="label">ジャンル別</span></div><div id="categories" class="cat"></div></section>
 <section class="card"><div class="sectionhead"><strong>支出の履歴</strong><button class="smallbtn" id="csvBtn">CSVを書き出す ↓</button></div><div id="history"></div></section>
 <div class="foot">記録はこのブラウザ内に保存されます · mimo ♡</div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='mimo-expenses-v1', SET='mimo-settings-v1';
const palette=['#f2b9d0','#cfc1ef','#f4d49b','#b8dfd1','#f0c2b7','#c5d9f3','#e8c5e8','#d6d6b4'];
const defaults={cutoff:15,categories:['食費','カフェ・おやつ','日用品','美容・服','交通費','医療・健康','趣味・娯楽','その他']};
let entries=JSON.parse(localStorage.getItem(KEY)||'[]'), settings={...defaults,...JSON.parse(localStorage.getItem(SET)||'{}')};
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(SET,JSON.stringify(settings));render()}
function cycle(date=new Date()){
 const d=new Date(date), y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),cut=Number(settings.cutoff)||15;
 let start,end;
 if(day>cut){start=new Date(y,m,cut+1);end=new Date(y,m+1,cut)}
 else{start=new Date(y,m-1,cut+1);end=new Date(y,m,cut)}
 const fmt=x=>`${x.getFullYear()}/${String(x.getMonth()+1).padStart(2,'0')}/${String(x.getDate()).padStart(2,'0')}`;
 return {start,end,label:`${fmt(start)} 〜 ${fmt(end)}`};
}
function classify(name){
 const s=name.toLowerCase();
 const rules=[
  ['カフェ・おやつ',/スタバ|スターバックス|カフェ|コーヒー|紅茶|スコーン|ケーキ|パン屋|パン|おやつ|コンビニスイーツ|タリーズ|ドトール|ゴンチャ/],
  ['食費',/スーパー|食材|食品|ごはん|ランチ|ディナー|夕食|昼食|朝食|弁当|お弁当|外食|レストラン|飲食|惣菜|お菓子/],
  ['日用品',/日用品|洗剤|ティッシュ|トイレットペーパー|ドラッグストア|薬局|生活用品|消耗品|雑貨/],
  ['美容・服',/服|洋服|美容|化粧|コスメ|スキンケア|ネイル|美容院|美容室|靴|バッグ|アクセサリー/],
  ['交通費',/電車|バス|タクシー|ガソリン|駐車場|高速|suica|pasmo|交通/],
  ['医療・健康',/病院|クリニック|診察|薬|薬代|医療|整体|歯医者|通院/],
  ['趣味・娯楽',/ディズニー|映画|ライブ|チケット|ゲーム|本|漫画|カメラ|旅行|レジャー/]
 ];
 for(const [cat,re] of rules)if(re.test(s)&&settings.categories.includes(cat))return cat;
 return 'その他';
}
function parseInput(raw){
 const s=raw.trim().replace(/,/g,'');
 const matches=[...s.matchAll(/\d+(?:\.\d+)?/g)];
 if(!matches.length)return null;
 const m=matches[matches.length-1], amount=Math.round(Number(m[0]));
 const purpose=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).replace(/[¥￥円]/g,'').replace(/\s+/g,' ').trim();
 if(!amount||!purpose)return null;
 return {purpose,amount};
}
function currentEntries(){const c=cycle();return entries.filter(e=>{const d=new Date(e.date+'T12:00:00');return d>=c.start&&d<=c.end})}
function render(){
 const c=cycle(),list=currentEntries(),sum=list.reduce((a,e)=>a+e.amount,0);
 document.getElementById('total').textContent=yen(sum);document.getElementById('period').textContent=`${c.label} · ${settings.cutoff}日締め`;
 document.getElementById('count').textContent=list.length+'件';document.getElementById('average').textContent=yen(list.length?Math.round(sum/list.length):0);
 const totals={};settings.categories.forEach(x=>totals[x]=0);list.forEach(e=>totals[e.category]=(totals[e.category]||0)+e.amount);
 const cats=Object.entries(totals).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 document.getElementById('categories').innerHTML=cats.length?cats.map(([n,v])=>`<div class="catline"><span>${esc(n)}</span><div class="bar"><div class="fill" style="width:${sum?v/sum*100:0}%;background:${palette[settings.categories.indexOf(n)%palette.length]}"></div></div><span class="catamount">${yen(v)}</span></div>`).join(''):'<div class="empty">まだ支出がないよ。最初の記録をしてみよう ♡</div>';
 const hist=[...list].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 document.getElementById('history').innerHTML=hist.length?hist.map(e=>`<div class="item"><span class="dot" style="background:${palette[Math.max(0,settings.categories.indexOf(e.category))%palette.length]}"></span><div class="itemmain"><div class="itemname">${esc(e.purpose)}</div><div class="itemmeta">${e.date.replaceAll('-','/')} · ${esc(e.category)}</div></div><div class="itemamt">${yen(e.amount)}</div><div class="actions"><button onclick="editEntry(${e.id})">編集</button></div></div>`).join(''):'<div class="empty">この期間の記録はまだないよ ☁</div>';
}
function add(){
 const inp=document.getElementById('quickInput'),p=parseInput(inp.value);
 if(!p){inp.focus();alert('「スタバ 680」のように、用途と金額を入力してね ♡');return}
 const now=new Date(),date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 entries.push({id:Date.now(),date,...p,category:classify(p.purpose)});inp.value='';save();inp.focus();
}
document.getElementById('addBtn').onclick=add;document.getElementById('quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
const overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
function close(){overlay.classList.remove('show')}overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
function editEntry(id){
 const e=entries.find(x=>x.id===id);if(!e)return;
 sheet.innerHTML=`<h3>支出を編集 ♡</h3><div class="field"><label>用途</label><input id="edPurpose" value="${esc(e.purpose)}"></div><div class="field"><label>金額</label><input id="edAmount" type="number" inputmode="numeric" value="${e.amount}"></div><div class="field"><label>ジャンル（変更できるよ）</label><select id="edCat">${settings.categories.map(c=>`<option ${c===e.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>日付</label><input id="edDate" type="date" value="${e.date}"></div><div class="btnrow"><button class="secondary" onclick="close()">戻る</button><button onclick="updateEntry(${id})">保存する</button></div><div class="btnrow"><button class="danger" onclick="deleteEntry(${id})">この記録を削除</button></div>`;
 overlay.classList.add('show');
}
window.editEntry=editEntry;window.close=close;
window.updateEntry=id=>{const e=entries.find(x=>x.id===id);const purpose=document.getElementById('edPurpose').value.trim(),amount=Number(document.getElementById('edAmount').value);if(!purpose||!amount)return alert('用途と金額を確認してね');Object.assign(e,{purpose,amount,category:document.getElementById('edCat').value,date:document.getElementById('edDate').value});close();save()};
window.deleteEntry=id=>{if(confirm('この記録を削除する？')){entries=entries.filter(x=>x.id!==id);close();save()}};
document.getElementById('settingsBtn').onclick=()=>{
 sheet.innerHTML=`<h3>設定 ♡</h3><div class="settingsline"><span>カードの締め日</span><span>毎月 <input id="cutoff" type="number" min="1" max="28" value="${settings.cutoff}"> 日</span></div><p class="hint">15日締めなら、毎月16日〜翌月15日を1つの期間として集計するよ。</p><div style="font-weight:700;font-size:13px;margin:16px 0 8px">ジャンル</div><div id="catSettings">${settings.categories.map((c,i)=>`<div class="settingsline"><span>${esc(c)}</span><button class="smallbtn" onclick="removeCat(${i})">削除</button></div>`).join('')}</div><div class="field"><label>ジャンルを追加</label><input id="newCat" placeholder="例：ペット"></div><div class="btnrow"><button class="secondary" onclick="close()">閉じる</button><button onclick="saveSettings()">保存する</button></div>
<div class="btnrow"><button class="secondary" onclick="backupData()">バックアップを書き出す</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">復元する</button></div>
<input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreData(event)">
`;
 overlay.classList.add('show');
};
window.removeCat=i=>{if(settings.categories.length<=1)return alert('ジャンルは1つ以上必要だよ');settings.categories.splice(i,1);document.getElementById('settingsBtn').click();};
window.saveSettings=()=>{const n=Number(document.getElementById('cutoff').value);if(n<1||n>28)return alert('締め日は1〜28日の間で設定してね');settings.cutoff=n;const add=document.getElementById('newCat').value.trim();if(add&&!settings.categories.includes(add))settings.categories.push(add);close();save()};
document.getElementById('csvBtn').onclick=()=>{const rows=[['日付','用途','金額','ジャンル'],...currentEntries().map(e=>[e.date,e.purpose,e.amount,e.category])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='mimo支出記録.csv';a.click();URL.revokeObjectURL(a.href)};

window.backupData=()=>{
 const payload={app:'mimo',version:1,exportedAt:new Date().toISOString(),settings,entries};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='mimo-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
window.restoreData=async ev=>{
 const file=ev.target.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(data.app!=='mimo'||!Array.isArray(data.entries)||!data.settings)throw new Error('invalid');
  if(!confirm('現在の記録をバックアップの内容に置き換えて復元するよ。続ける？'))return;
  entries=data.entries;settings={...defaults,...data.settings};save();close();alert('復元できたよ ♡');
 }catch(e){alert('このバックアップファイルは読み込めなかったよ。mimoのバックアップを選んでね。')}
 ev.target.value='';
};
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

render();
</script>
</body></html>
